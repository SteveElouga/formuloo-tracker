# https://taskfile.dev — GP-Formuloo. Orchestrateur ; s'étoffe au fil des stories.
version: '3'
silent: true

tasks:
  default:
    cmds:
      - task --list

  install:hooks:
    desc: Active les hooks Git versionnés (.githooks) — OBLIGATOIRE
    cmds:
      - sh scripts/install-hooks.sh

  # ─── Contrats (buf) ──────────────────────────────────────
  proto:lint:
    desc: Lint des contrats protobuf
    dir: protos
    cmds: [buf lint]
  proto:breaking:
    desc: Détection de rupture de contrat vs origin/develop
    dir: protos
    cmds: ["buf breaking --against '.git#branch=origin/develop,subdir=protos'"]
  proto:gen:
    desc: Génère le code protobuf/gRPC (sortie git-ignorée)
    dir: protos
    cmds: [buf generate]

  # ─── Lint / Tests / Build (FT-1) ─────────────────────────
  lint:
    desc: Lint backend (ruff) + frontend (eslint)
    cmds: [{ task: lint:back }, { task: lint:front }]
  lint:back:
    dir: services/gateway-graphql
    cmds: [uv run ruff check .]
  lint:front:
    dir: frontend
    cmds: [pnpm run lint]
  test:
    desc: Tests backend (pytest) + frontend (jest)
    cmds: [{ task: test:back }, { task: test:front }]
  test:back:
    dir: services/gateway-graphql
    cmds: [uv run pytest]
  test:front:
    dir: frontend
    cmds: [pnpm test]
  build:
    desc: Build des images Docker (tag local)
    cmds:
      - docker build -t gp-formuloo/gateway-graphql:local services/gateway-graphql
      - docker build -t gp-formuloo/frontend:local frontend

  # ─── Infra locale (FT-2) ─────────────────────────────────
  up:
    desc: "Démarre l'infra locale (Traefik, Keycloak, Postgres, RabbitMQ, Redis, MinIO)"
    dir: deploy/compose
    cmds:
      - docker compose --env-file ../../.env -f docker-compose.yml -f docker-compose.override.dev.yml up -d
  down:
    desc: "Arrête l'infra locale"
    dir: deploy/compose
    cmds:
      - docker compose --env-file ../../.env -f docker-compose.yml -f docker-compose.override.dev.yml down
  smoke:
    desc: "Vérifie que la pile infra est saine (FT-2 DoD)"
    cmds:
      - bash scripts/smoke.sh
  up:obs:
    desc: "(FT-3) Ajoute la pile observabilité (LGTM)"
    dir: deploy/compose
    cmds:
      - echo "FT-3 à venir — docker-compose.observability.yml"
