# GP-Formuloo — infrastructure locale (FT-2). Edge + état. `docker compose up`.
# Services applicatifs = FT-4/5 ; observabilité (profil obs) = FT-3.
# Routage dynamique Traefik (provider Docker via docker-socket-proxy) = FT-E1/FT-4.
name: gp-formuloo

networks:
  edge:            # Traefik <-> Keycloak / gateway (exposé)
  backend:         # état + gRPC (non exposé)
  observability:   # déclaré ici, peuplé en FT-3 (LGTM)

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:

services:
  traefik:
    image: traefik:3.1
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--ping=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"          # dashboard :8080 (dev, localhost uniquement)
      # Provider Docker + routage (Keycloak, gateway) = FT-E1/FT-4, via docker-socket-proxy
      # (jamais le socket brut monté ici — sécurité, DAT §12).
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_EXTRA_DBS: ${POSTGRES_EXTRA_DBS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_URL_DATABASE}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./config/keycloak/health.sh:/opt/keycloak-health.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, backend]
    # Labels de routage Traefik ajoutés en FT-E1 (quand le provider Docker sécurisé est en place).
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak-health.sh"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    mem_limit: 768m

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [backend]
    # Image ubi-micro sans curl/bash -> pas de healthcheck natif ; vérifié par scripts/smoke.sh.
    mem_limit: 512m
