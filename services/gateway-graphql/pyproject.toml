[project]
name = "gateway-graphql"
version = "0.1.0"
description = "GP-Formuloo — gateway GraphQL (Strawberry). Squelette FT-1."
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "gunicorn>=22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gateway.settings"
pythonpath = ["src"]
testpaths = ["tests"]
