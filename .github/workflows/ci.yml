name: CI
# Pipeline FT-1 : garde-fous + buf + tests + build/push images.
# Checks requis (protection de branche) : "Garde-fous PR" et "CI OK" (voir scripts/setup-github.sh).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  garde-fous:
    name: Garde-fous PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Cible de PR conforme (seule develop -> main)
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "✖ Une PR vers 'main' ne peut provenir que de 'develop' (MEMORY.md R6) : ${{ github.head_ref }} -> ${{ github.base_ref }}"
            exit 1
          fi
          echo "✓ Cible de PR conforme (${{ github.head_ref }} -> ${{ github.base_ref }})."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Messages de commit (Conventional Commits)
        run: |
          git fetch --no-tags --depth=100 origin "${{ github.base_ref }}"
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad="$(git log --format='%s' "origin/${{ github.base_ref }}..HEAD" | grep -vE '^(Merge |Revert )' | grep -vE "$pattern" || true)"
          if [ -n "$bad" ]; then
            echo "✖ Commit(s) non conforme(s) aux Conventional Commits :"
            echo "$bad"
            exit 1
          fi
          echo "✓ Messages de commit conformes."

  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proto:
              - 'protos/**'
            backend:
              - 'services/**'
              - 'protos/**'
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            compose:
              - 'deploy/**'
              - 'scripts/smoke.sh'

  proto:
    name: Contrats (buf)
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint
        working-directory: protos
        run: buf lint
      - name: Breaking (vs base, si baseline présente)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:protos/buf.yaml" 2>/dev/null; then
            buf breaking protos --against ".git#ref=origin/${{ github.base_ref }},subdir=protos"
          else
            echo "ℹ Pas de baseline protos sur '${{ github.base_ref }}' — breaking ignoré (première introduction)."
          fi
      - name: Generate (le codegen doit réussir)
        working-directory: protos
        run: buf generate

  backend:
    name: Backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway-graphql
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (eslint + jest + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Lint (eslint)
        run: pnpm run lint
      - name: Tests (jest)
        run: pnpm test
      - name: Build
        run: pnpm run build

  images:
    name: Images (ghcr)
    needs: [backend, frontend]
    if: always() && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway-graphql
            context: services/gateway-graphql
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules (contrainte ghcr)
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login ghcr (uniquement sur push develop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Compose (infra healthy)
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env de CI (valeurs placeholder)
        run: cp .env.example .env
      - name: Démarrer la pile infra
        working-directory: deploy/compose
        run: docker compose --env-file ../../.env -f docker-compose.yml -f docker-compose.smoke.yml up -d
      - name: Smoke (healthy + endpoints)
        run: bash scripts/smoke.sh
      - name: Logs si échec
        if: failure()
        working-directory: deploy/compose
        run: docker compose --env-file ../../.env logs --no-color --tail 200
      - name: Arrêt
        if: always()
        working-directory: deploy/compose
        run: docker compose --env-file ../../.env -f docker-compose.yml -f docker-compose.smoke.yml down -v

  ci-ok:
    name: CI OK
    needs: [garde-fous, changes, proto, backend, frontend, images, compose-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aucun job requis en échec (skipped toléré)
        run: |
          results="${{ needs['garde-fous'].result }} ${{ needs.changes.result }} ${{ needs.proto.result }} ${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.images.result }} ${{ needs['compose-smoke'].result }}"
          echo "Résultats: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "✖ Un job requis a échoué ($r)."; exit 1 ;;
            esac
          done
          echo "✓ CI verte (jobs non concernés = skipped, tolérés)."
